name: Deploy

# Deploys the production build to Vercel on every push to main.
# Vercel auto-detects TanStack Start + Nitro and fills in build settings.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — Vercel API token (Settings → Tokens)
#   VERCEL_ORG_ID       — Your Vercel org ID (from .vercel/project.json)
#   VERCEL_PROJECT_ID   — Your Vercel project ID (from .vercel/project.json)
# Until those are configured the deploy step skips itself with a warning.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to the repo secrets."
            exit 0
          fi
          vercel --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
